name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: |
          npm ci
          npm ci --prefix functions
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build (no deploy)
        env:
          VITE_DEMO_MODE: 'true'
        run: npm run build
      - name: Unit tests
        run: npm test
